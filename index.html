<title>여왕 폐하의 간택 목록</title>
<meta name="description" content="부평·남동권 1.5룸 이상 월세 매물, 보증금 높은 순">
<style>
  :root{
    /* 한지 — 낮의 궁 */
    --bg:#f5efe0; --bg-2:#efe6d2; --surface:#fffcf4;
    --ink:#241c14; --ink-soft:#6b5b48; --ink-faint:#74644e;
    --rule:#d9cbaf; --rule-soft:#e7dcc4;
    --gold:#75590f;
    --gold-bright:#8f6f14; --gold-wash:#f2e7c8;
    --cinnabar:#a6322e; --cinnabar-wash:#f4e0dc;
    --jade:#2f6b52; --jade-wash:#dcece3;
    --lapis:#2c4e86;
    --seal-bg:#a6322e; --seal-fg:#fff6e8;
    --plaque-bg:#241c14; --plaque-fg:#f2e7c8;
    --l1:#2c4e86; --li1:#5f86b8; --li2:#9a6a12;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      /* 흑칠 — 밤의 궁 */
      --bg:#12100d; --bg-2:#0d0b09; --surface:#1c1813;
      --ink:#ede2cb; --ink-soft:#a2957c; --ink-faint:#8f8371;
      --rule:#3a3227; --rule-soft:#2a2419;
      --gold:#d8b44a; --gold-bright:#f2dfa2; --gold-wash:#2e2717;
      --cinnabar:#e0796f; --cinnabar-wash:#33201e;
      --jade:#6fb693; --jade-wash:#1a2b23;
      --lapis:#7fa6de;
      --seal-bg:#8f2b28; --seal-fg:#ffeede;
      --plaque-bg:#0a0908; --plaque-fg:#e8d49a;
      --l1:#7fa6de; --li1:#9dc4ef; --li2:#e0b45c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12100d; --bg-2:#0d0b09; --surface:#1c1813;
    --ink:#ede2cb; --ink-soft:#a2957c; --ink-faint:#8f8371;
    --rule:#3a3227; --rule-soft:#2a2419;
    --gold:#d8b44a; --gold-bright:#f2dfa2; --gold-wash:#2e2717;
    --cinnabar:#e0796f; --cinnabar-wash:#33201e;
    --jade:#6fb693; --jade-wash:#1a2b23;
    --lapis:#7fa6de;
    --seal-bg:#8f2b28; --seal-fg:#ffeede;
    --plaque-bg:#0a0908; --plaque-fg:#e8d49a;
    --l1:#7fa6de; --li1:#9dc4ef; --li2:#e0b45c;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;
    padding:0 0 calc(48px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:680px; margin:0 auto; padding:0 16px}

  /* 궁서 계열 — 시스템 세리프만 사용(외부 폰트 없음) */
  .myeongjo{font-family:"AppleMyungjo","Nanum Myeongjo","Batang",바탕,"Noto Serif KR",serif}

  /* ── 단청 띠 ───────────────────────────── */
  .dancheong{
    height:6px;
    background:repeating-linear-gradient(90deg,
      var(--cinnabar) 0 14px, var(--jade) 14px 28px,
      var(--lapis) 28px 42px, var(--gold-bright) 42px 56px);
    opacity:.85;
  }

  /* ── 어전 머리 ─────────────────────────── */
  header{background:var(--plaque-bg); color:var(--plaque-fg); padding:26px 0 22px; text-align:center}
  header .crest{
    width:46px; height:46px; margin:0 auto 12px; border-radius:50%;
    border:1.5px solid var(--gold); display:grid; place-items:center;
    box-shadow:0 0 0 4px color-mix(in srgb, var(--gold) 18%, transparent);
  }
  header .crest span{font-size:20px; line-height:1; color:var(--gold-bright)}
  h1{
    font-size:27px; margin:0 0 8px; letter-spacing:.06em; font-weight:400;
    color:var(--plaque-fg); text-wrap:balance;
  }
  header .sub{
    font-size:13.5px; color:color-mix(in srgb, var(--plaque-fg) 62%, transparent);
    margin:0; letter-spacing:.03em;
  }
  header .updated{
    display:inline-block; margin-top:14px; padding:4px 14px;
    border:1px solid color-mix(in srgb, var(--gold) 45%, transparent);
    border-radius:2px; font-size:12.5px; letter-spacing:.08em;
    color:var(--gold-bright);
  }

  /* ── 어람 요약(호패) ───────────────────── */
  .stats{display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 18px}
  .stat{
    flex:1 1 72px; min-width:0; text-align:center;
    background:var(--surface); border:1px solid var(--rule);
    border-top:2px solid var(--gold); border-radius:2px; padding:11px 6px;
  }
  .stat b{display:block; font-size:23px; line-height:1.15; color:var(--ink); font-variant-numeric:tabular-nums}
  .stat span{font-size:12px; color:var(--ink-faint); letter-spacing:.04em}

  /* ── 교서 ──────────────────────────────── */
  .edict{
    background:var(--surface); border:1px solid var(--rule);
    border-left:3px solid var(--cinnabar); border-radius:2px;
    padding:15px 16px; margin:0 0 26px; font-size:14.5px; line-height:1.7;
  }
  .edict p{margin:0 0 10px} .edict p:last-child{margin:0}
  .edict b{color:var(--ink); letter-spacing:.02em}
  .edict a{color:var(--gold); text-underline-offset:3px}
  .edict a:hover{color:var(--gold-bright)}

  /* ── 현판(노선 편액) ───────────────────── */
  .plaque{
    display:flex; align-items:center; gap:10px;
    background:var(--plaque-bg); color:var(--plaque-fg);
    border-radius:3px; padding:11px 14px; margin:30px 0 14px;
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent),
               inset 0 0 0 4px var(--plaque-bg),
               inset 0 0 0 5px color-mix(in srgb, var(--gold) 22%, transparent);
  }
  .plaque .bar{width:3px; height:19px; border-radius:1px; background:var(--ink-faint); flex:none}
  .plaque[data-line="1"] .bar{background:var(--l1)}
  .plaque[data-line="I1"] .bar{background:var(--li1)}
  .plaque[data-line="I2"] .bar{background:var(--li2)}
  .plaque[data-line="I12"] .bar{background:linear-gradient(var(--li1) 50%, var(--li2) 50%)}
  .plaque h2{font-size:17px; margin:0; font-weight:400; letter-spacing:.05em}
  .plaque small{
    margin-left:auto; text-align:right; font-size:12px; letter-spacing:.02em;
    color:color-mix(in srgb, var(--plaque-fg) 55%, transparent);
  }

  /* ── 교지(매물 카드) ───────────────────── */
  .cards{display:flex; flex-direction:column; gap:12px}
  .card{
    position:relative; background:var(--surface);
    border:1px solid var(--rule); border-radius:2px; padding:16px 16px 14px;
    box-shadow:inset 0 0 0 1px var(--surface), inset 0 0 0 2px var(--rule-soft);
  }
  .card::before{
    content:""; position:absolute; inset:5px; pointer-events:none;
    border:1px solid color-mix(in srgb, var(--gold) 26%, transparent); border-radius:1px;
  }
  .rank{
    position:absolute; top:-1px; right:12px;
    background:var(--gold-wash); color:var(--gold);
    border:1px solid color-mix(in srgb, var(--gold) 38%, transparent); border-top:0;
    border-radius:0 0 3px 3px; padding:3px 8px 4px;
    font-size:11.5px; letter-spacing:.1em;
  }
  .head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; padding-right:62px}
  .seal{
    flex:none; background:var(--seal-bg); color:var(--seal-fg);
    border-radius:3px; padding:5px 9px; font-size:13.5px; letter-spacing:.06em;
    box-shadow:inset 0 0 0 1px color-mix(in srgb, #fff 26%, transparent);
  }
  .price{font-size:25px; line-height:1.1; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.01em}
  .price .slash{color:var(--gold); margin:0 1px; font-size:20px}
  .price em{font-style:normal; font-size:13.5px; color:var(--ink-faint); margin-left:4px; letter-spacing:0}

  .spec{
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px 14px; margin:0 0 12px; padding:12px 0 0;
    border-top:1px solid var(--rule-soft);
  }
  .spec>div{display:flex; gap:8px; align-items:baseline; min-width:0}
  .spec dt{
    flex:none; width:52px; font-size:11.5px; letter-spacing:.08em;
    color:var(--ink-faint);
  }
  .spec dd{margin:0; font-size:14px; color:var(--ink-soft); min-width:0; word-break:keep-all}
  .spec dd.strong{color:var(--ink)}

  .tags{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:13px}
  .tags:empty{display:none}
  .tag{
    border:1px solid var(--rule); border-radius:2px; padding:2.5px 8px;
    font-size:11.5px; letter-spacing:.04em; color:var(--ink-faint); background:var(--bg-2);
  }
  .tag.warn{color:var(--cinnabar); background:var(--cinnabar-wash); border-color:color-mix(in srgb, var(--cinnabar) 32%, transparent)}
  .tag.good{color:var(--jade); background:var(--jade-wash); border-color:color-mix(in srgb, var(--jade) 32%, transparent)}

  /* ── 신규(새로 든 것) 표식 ─────────────── */
  .card.is-new{
    border-color:color-mix(in srgb, var(--jade) 45%, var(--rule));
    box-shadow:inset 0 0 0 1px var(--surface), inset 0 0 0 2px var(--jade-wash);
  }
  .card.is-new::before{border-color:color-mix(in srgb, var(--jade) 34%, transparent)}
  .card.is-new .rank{
    background:var(--jade-wash); color:var(--jade);
    border-color:color-mix(in srgb, var(--jade) 42%, transparent);
  }
  .newmark{
    position:absolute; top:-1px; left:12px;
    background:var(--jade); color:var(--surface);
    border-radius:0 0 3px 3px; padding:3px 8px 4px;
    font-size:11.5px; letter-spacing:.14em;
  }
  .card.is-new .head{padding-left:52px}

  /* ── 간택 범위 가리개(신규/전체) ───────── */
  .switch{
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
    margin:0 0 20px; font-size:12.5px; color:var(--ink-faint);
  }
  .switch .lab{letter-spacing:.06em; margin-right:2px}
  .switch button{
    font:inherit; cursor:pointer; color:var(--ink-faint);
    background:var(--surface); border:1px solid var(--rule); border-radius:2px;
    padding:6px 13px; letter-spacing:.05em;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .switch button:hover{color:var(--ink); border-color:var(--gold)}
  .switch button[aria-pressed="true"]{
    color:var(--plaque-fg); background:var(--plaque-bg); border-color:var(--plaque-bg);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--gold) 42%, transparent);
  }
  .switch button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .switch .n{font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){ .switch button{transition:none} }

  .go{
    display:block; text-align:center; text-decoration:none;
    background:var(--plaque-bg); color:var(--plaque-fg);
    border-radius:2px; padding:11px 14px; font-size:14px; letter-spacing:.08em;
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--gold) 42%, transparent);
    transition:box-shadow .15s ease, color .15s ease;
  }
  .go:hover{color:var(--gold-bright); box-shadow:inset 0 0 0 1px var(--gold)}
  .go:focus-visible, .edict a:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  .empty{
    background:var(--surface); border:1px dashed var(--rule); border-radius:2px;
    padding:26px 16px; text-align:center; color:var(--ink-faint); font-size:14px;
  }

  footer{
    margin-top:34px; padding-top:20px; border-top:1px solid var(--rule);
    color:var(--ink-faint); font-size:12px; text-align:center; line-height:1.8;
  }

  .card{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){
    .card{animation:none}
    .go{transition:none}
  }
</style>
</head>

<div class="dancheong"></div>

</div>

<script>
(function(){
  var D = window.DABANG || {listings:[]};
  var LINES = [
    {key:"1",   name:"1호선 (경인선)", short:"1호선",  desc:"부평"},
    {key:"I1",  name:"인천1호선",      short:"인천1",  desc:"간석오거리"},
    {key:"I12", name:"인천1·2호선",    short:"인천1·2", desc:"인천시청 (환승)"},
    {key:"I2",  name:"인천2호선",      short:"인천2",  desc:"모래내시장 · 만수"}
  ];
  var RANKS = ["정1품","종1품","정2품","종2품","정3품","종3품","정4품","종4품","정5품","종5품","정6품","종6품"];
  var WARN = {"북향":1,"서향":1,"반지하":1,"1층":1,"꼭대기층":1};
  var list = D.listings || [];

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function links(arr){
    return arr.map(function(n){
      return '<a href="https://www.dabangapp.com/room/'+esc(n.id)+'" target="_blank" rel="noopener">'+
             esc(n.label)+'</a>';
    }).join(' · ');
  }

  document.getElementById('updated').textContent =
    D.updated ? (D.updated + ' 어람') : '아직 갱신 전';

  var stats = document.getElementById('stats');
  LINES.forEach(function(L){
    var n = list.filter(function(x){return x.line===L.key;}).length;
    var d = document.createElement('div');
    d.className = 'stat';
    d.innerHTML = '<b>'+n+'</b><span>'+esc(L.short)+'</span>';
    stats.appendChild(d);
  });

  var html = '';
  if ((D.halfRooms||[]).length){
    html += '<p><b>1.5룸(분리형)</b> — 다방 목록엔 그냥 ‘원룸’으로 떠서 상세를 열어야 갈리는 구조다. ' +
            '이번에 가려낸 '+D.halfRooms.length+'건: ' + links(D.halfRooms) + '</p>';
  }
  if ((D.newBuilds||[]).length){
    html += '<p><b>신축(2020년+)</b> — 보증금이 낮아 아래에 묻히니 여기 따로: ' + links(D.newBuilds) + '</p>';
  }
  html += '<p><b>新 표식</b> — 옥테를 푸르게 두르고 왼편에 <b>新</b>을 단 교지가 이번에 처음 든 매물이다. ' +
          '표식 없는 것은 전부터 올라 있던 것이니, 아래 가리개로 갈라 볼 수 있다.</p>';
  html += '<p><b>전입신고 주의</b> — 다방 목록 표기와 무관하게 건축물용도가 근생·숙박·업무면 ' +
          '전입신고가 안 되는 경우가 대부분이다. 여기 오른 건 상세에서 공동주택·단독주택으로 확인된 것만이다.</p>';
  document.getElementById('note').innerHTML = html;

  function isNew(r){ return (r.tags||[]).indexOf('NEW') >= 0; }
  var newCount = list.filter(isNew).length;
  var mode = 'all';

  var sw = document.getElementById('switch');
  sw.innerHTML =
    '<span class="lab">간택 범위</span>' +
    '<button type="button" data-mode="all" aria-pressed="true">전체 <span class="n">'+list.length+'</span>건</button>' +
    '<button type="button" data-mode="new" aria-pressed="false"'+(newCount?'':' disabled')+'>' +
      '새로 든 것 <span class="n">'+newCount+'</span>건</button>' +
    '<button type="button" data-mode="old" aria-pressed="false">' +
      '전부터 있던 것 <span class="n">'+(list.length-newCount)+'</span>건</button>';
  sw.addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-mode]');
    if (!b || b.disabled) return;
    mode = b.getAttribute('data-mode');
    Array.prototype.forEach.call(sw.querySelectorAll('button[data-mode]'), function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    render();
  });

  var wrap = document.getElementById('sections');
  function render(){
  wrap.innerHTML = '';
  LINES.forEach(function(L){
    var all = list.filter(function(x){return x.line===L.key;});
    var rows = all.filter(function(x){
      return mode==='all' || (mode==='new' ? isNew(x) : !isNew(x));
    });

    var h = document.createElement('div');
    h.className = 'plaque';
    h.setAttribute('data-line', L.key);
    h.innerHTML = '<span class="bar"></span><h2 class="myeongjo">'+esc(L.name)+'</h2>'+
                  '<small>'+esc(L.desc)+'</small>';
    wrap.appendChild(h);

    if (!rows.length){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = !D.updated ? '루틴 첫 실행 시 채워짐'
        : mode==='new' ? '이 노선엔 이번에 새로 든 매물이 없사옵니다'
        : mode==='old' ? '이 노선은 이번에 새로 든 것뿐이옵니다'
        : '이 노선엔 간택할 만한 주거용 매물이 없사옵니다';
      wrap.appendChild(e);
      return;
    }

    var box = document.createElement('div');
    box.className = 'cards';
    rows.forEach(function(r, i){
      var rank = all.indexOf(r);
      var c = document.createElement('article');
      c.className = 'card' + (isNew(r) ? ' is-new' : '');
      c.style.animationDelay = Math.min(i,7)*45 + 'ms';

      var spec = [
        ['구조', r.rtype, true],
        ['용도', r.use, false],
        ['사용승인', r.appr, false],
        ['방향', r.dir ? r.dir+'향' : '', false],
        ['층', r.floor, false],
        ['관리비', r.maint, false]
      ].filter(function(x){return x[1];}).map(function(x){
        return '<div><dt>'+esc(x[0])+'</dt><dd'+(x[2]?' class="strong"':'')+'>'+esc(x[1])+'</dd></div>';
      }).join('');

      var tags = (r.tags||[]).filter(function(t){return t!=='NEW';}).map(function(t){
        return '<span class="tag '+(WARN[t]?'warn':'')+'">'+esc(t)+'</span>';
      }).join('');

      c.innerHTML =
        '<div class="rank myeongjo">'+esc(RANKS[rank]||('제'+(rank+1)+'위'))+'</div>'+
        (isNew(r) ? '<div class="newmark myeongjo">新</div>' : '')+
        '<div class="head">'+
          '<span class="seal myeongjo">'+esc(r.station)+'</span>'+
          '<span class="price myeongjo">'+esc(r.dep)+'<span class="slash">/</span>'+esc(r.rent)+
          '<em>만원</em></span>'+
        '</div>'+
        '<dl class="spec">'+spec+'</dl>'+
        '<div class="tags">'+tags+'</div>'+
        '<a class="go myeongjo" href="https://www.dabangapp.com/room/'+esc(r.id)+'" '+
          'target="_blank" rel="noopener">다방에서 보기</a>';
      box.appendChild(c);
    });
    wrap.appendChild(box);
  });
  }
  render();
})();
</script>
